<script>(function () {
  var destino = 'https://carlosp1006.github.io/shelfy-site/';
  var bruto = '';
  try {
    bruto = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, '');
  } catch (erro) {
    bruto = '';
  }
  if (!bruto) bruto = new URLSearchParams(location.search).get('c') || location.hash.slice(1);
  var codigo = /^#?[Pp]?-?0*([0-9]{1,8})$/.exec(String(bruto).replace(/\s+/g, '').slice(0, 24));
  location.replace(codigo ? destino + '?c=P' + codigo[1].padStart(4, '0') : destino);
})();</script>
